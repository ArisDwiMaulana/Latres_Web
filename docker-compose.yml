services:
  # 1. WEB SERVER
  web:
    image: php:8.2-apache
    container_name: apache-latres
    entrypoint:
      ["sh", "-c", "docker-php-ext-install mysqli && apache2-foreground"]
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    networks:
      - xampp-network

  # 2. DATABASE SERVER
  db:
    image: mariadb:10.4
    container_name: mysql-latres
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - xampp_db_data:/var/lib/mysql
    networks:
      - xampp-network

  # 3. PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myadmin-latres
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
    networks:
      - xampp-network

networks:
  xampp-network:
    driver: bridge

volumes:
  xampp_db_data:
